<text x="75.0" y="104.0" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#fff">初始化配置</text>
<text x="75" y="142" class="lb">init</text>
<line x1="140" y1="98" x2="144" y2="98" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
