<text x="360.0" y="454.0" text-anchor="middle" class="t" font-size="11" font-weight="700" fill="#fff">2 FAIL</text>
<rect x="426" y="430" width="112" height="36" rx="10" fill="#ef4444" stroke="#fff" stroke-width="1.5" filter="url(#sh)"/>
<text x="482.0" y="454.0" text-anchor="middle" class="t" font-size="11" font-weight="700" fill="#fff">3 USAGE</text>
<rect x="548" y="430" width="112" height="36" rx="10" fill="#ef4444" stroke="#fff" stroke-width="1.5" filter="url(#sh)"/>
<text x="604.0" y="454.0" text-anchor="middle" class="t" font-size="11" font-weight="700" fill="#fff">4 CONFIG</text>
<rect x="670" y="430" width="112" height="36" rx="10" fill="#ef4444" stroke="#fff" stroke-width="1.5" filter="url(#sh)"/>
<text x="726.0" y="454.0" text-anchor="middle" class="t" font-size="11" font-weight="700" fill="#fff">5 RUNTIME</text>
<rect x="792" y="430" width="112" height="36" rx="10" fill="#ef4444" stroke="#fff" stroke-width="1.5" filter="url(#sh)"/>
<text x="848.0" y="454.0" text-anchor="middle" class="t" font-size="11" font-weight="700" fill="#fff">6 REFUSE</text>
</svg>