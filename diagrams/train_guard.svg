<text x="229" y="142" class="lb">doctor</text>
<line x1="294" y1="98" x2="298" y2="98" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<rect x="318" y="70" width="130" height="56" rx="10" fill="#ec4899" stroke="#fff" stroke-width="1.5" filter="url(#sh)"/>
<text x="383.0" y="104.0" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#fff">数据校验</text>
<text x="383" y="142" class="lb">data-check</text>
<line x1="448" y1="98" x2="452" y2="98" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<rect x="472" y="70" width="130" height="56" rx="10" fill="#f59e0b" stroke="#fff" stroke-width="1.5" filter="url(#sh)"/>
<text x="537.0" y="104.0" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#fff">训练观测</text>
<text x="537" y="142" class="lb">watch</text>
<line x1="602" y1="98" x2="606" y2="98" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<rect x="626" y="70" width="130" height="56" rx="10" fill="#ef4444" stroke="#fff" stroke-width="1.5" filter="url(#sh)"/>
<text x="691.0" y="104.0" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#fff">输出检查</text>
<text x="691" y="142" class="lb">check</text>
<line x1="756" y1="98" x2="760" y2="98" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<rect x="780" y="70" width="130" height="56" rx="10" fill="#10b981" stroke="#fff" stroke-width="1.5" filter="url(#sh)"/>
<text x="845.0" y="104.0" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#fff">生成清单</text>
<text x="845" y="142" class="lb">manifest</text>
<rect x="50" y="190" width="260" height="200" rx="10" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
<text x="180.0" y="296.0" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#fff">接口 Interfaces</text>
<text x="68" y="225" class="t" font-size="13" font-weight="700" fill="#f1f5f9">CLI 命令行</text>
<text x="68" y="247" class="t" font-size="11" fill="#94a3b8">主要交互界面</text>
<text x="68" y="275" class="t" font-size="13" font-weight="700" fill="#f1f5f9">Python API</text>
<text x="68" y="297" class="t" font-size="11" fill="#94a3b8">程序化调用</text>
<text x="68" y="325" class="t" font-size="13" font-weight="700" fill="#f1f5f9">HF Callback</text>
<text x="68" y="347" class="t" font-size="11" fill="#94a3b8">Hugging Face 集成</text>
<text x="68" y="375" class="t" font-size="13" font-weight="700" fill="#f1f5f9">Web Dashboard</text>
<text x="68" y="397" class="t" font-size="11" fill="#94a3b8">Loopback 可视化</text>
<text x="68" y="425" class="t" font-size="13" font-weight="700" fill="#f1f5f9">SSH TUI</text>
<text x="68" y="447" class="t" font-size="11" fill="#94a3b8">远程终端面板</text>
<rect x="340" y="190" width="530" height="200" rx="10" fill="#fef2f2" stroke="#991b1b" stroke-width="1.5" filter="url(#sh)"/>
<text x="605.0" y="296.0" text-anchor="middle" class="t" font-size="15" font-weight="700" fill="#fff">安全边界 Safety Boundary</text>
<text x="360" y="228" class="t" font-size="12" fill="#7f1d1d">• 路径脱敏 — 不暴露绝对路径</text>
<text x="360" y="254" class="t" font-size="12" fill="#7f1d1d">• 无遥测 — 默认不安装/上传</text>
<text x="360" y="280" class="t" font-size="12" fill="#7f1d1d">• 不修改训练数据 — 只读观测</text>
<text x="360" y="306" class="t" font-size="12" fill="#7f1d1d">• 受控恢复 — 仅显式 argv 重启</text>
<text x="360" y="332" class="t" font-size="12" fill="#7f1d1d">• 本地优先 — Loopback 仅限本机</text>
<rect x="60" y="430" width="112" height="36" rx="10" fill="#10b981" stroke="#fff" stroke-width="1.5" filter="url(#sh)"/>
<text x="116.0" y="454.0" text-anchor="middle" class="t" font-size="11" font-weight="700" fill="#fff">0 PASS</text>
