# Train Guard example config (YAML needs PyYAML; JSON also supported)
# Priority: CLI > this file > defaults

schema_version: 1

doctor:
  model_path: ./models/example-model
  expected_gpus: null

data:
  check:
    annotation: ./data/train.jsonl
    data_root: ./data/media
    sample_limit: 1000          # avoid scanning huge corpora by default
    full_scan: false
    compute_hash: false
    verify_images: true         # skipped automatically if Pillow missing
    messages: messages
    media: media
    group_id: group_id
    split: split
    report_dir: ./reports/data_check

run:
  watch:
    interval: 30
    once: true
    framework: generic
    output_dir: ./outputs
    log_file: ./outputs/train.log
    expected_gpus: null
    stale_log_minutes: 15
    disk_free_gb_threshold: 10.0

eval:
  predictions: ./outputs/predictions.jsonl
  references: ./data/references.jsonl
  group_id: group_id
  keywords: []
