[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "train-guard"
dynamic = ["version"]
description = "Local-first reliability checks and guarded recovery for LLM/VLM training"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "Train Guard Contributors" }
]
keywords = ["training", "reliability", "monitoring", "llm", "vlm", "recovery"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
image = ["Pillow>=9.0"]
psutil = ["psutil>=5.9"]
tui = ["textual>=1"]
all = ["PyYAML>=6.0", "Pillow>=9.0", "psutil>=5.9", "textual>=1"]
dev = [
  "build",
  "mypy",
  "pip-audit",
  "pytest",
  "pytest-cov",
  "ruff",
  "twine",
]

[project.scripts]
train-guard = "train_guard.cli:main"

[project.urls]
Homepage = "https://github.com/Hyhyhyyy/train_guard"
Documentation = "https://github.com/Hyhyhyyy/train_guard#readme"
Repository = "https://github.com/Hyhyhyyy/train_guard.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "train_guard.__version__" }

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --import-mode=importlib"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["train_guard"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["release"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["F401"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true
no_implicit_optional = true
pretty = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
exclude = ["^release/"]
