    <clipPath id="clip_train_guard"><rect x="0" y="0" width="1280" height="380" rx="18"/></clipPath>
    <radialGradient id="glow_g_train_guard" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fca5a5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fca5a5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g clip-path="url(#clip_train_guard)">
