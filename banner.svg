<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-label="Train Guard">
  <defs>
    <linearGradient id="bg_train_guard" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0.00" stop-color="#1c1917"/><stop offset="0.33" stop-color="#292524"/><stop offset="0.67" stop-color="#7f1d1d"/><stop offset="1.00" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="g_train_guard" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fee2e2"/>
      <stop offset="0.5" stop-color="#fecaca"/>
      <stop offset="1" stop-color="#fcd34d"/>
      <animate attributeName="x1" values="0;0.3;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0.7;1" dur="8s" repeatCount="indefinite"/>
