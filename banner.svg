<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" role="img" aria-label="train_guard" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1a2e"/>
      <stop offset="1" stop-color="#15293f"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="380" fill="url(#bg)"/>
  <circle cx="960" cy="190" r="152" fill="#38bdf8" opacity="0.07"/>
  <circle cx="960" cy="190" r="152" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.18"/>
  <rect x="-120" y="0" width="64" height="380" fill="url(#beam)">
    <animate attributeName="x" values="-120;1240;-120" dur="9s" repeatCount="indefinite"/>
  </rect>
  <g transform="translate(960,190)">
    <circle r="118" fill="#091626" stroke="#38bdf8" stroke-width="8"/>
    <path d="M0,-72 C44,-72 72,-50 72,-10 C72,40 30,66 0,80 C-30,66 -72,40 -72,-10 C-72,-50 -44,-72 0,-72 Z" fill="#0c1a2e" stroke="#38bdf8" stroke-width="8"/>
    <path d="M-44,2 L-18,2 L-6,-26 L10,28 L24,2 L44,2" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <circle cx="210" cy="120" r="66" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.22">
    <animate attributeName="r" values="56;80;56" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.34;0.08;0.34" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <text x="70" y="150" font-size="60" font-weight="800" fill="url(#title)">train_guard</text>
  <text x="72" y="198" font-size="22" fill="#bcd6ef" opacity="0.9">LLM/VLM 训练可靠性守护</text>
  <g font-size="16" font-weight="600">
    <rect x="72" y="220" width="120" height="34" rx="17" fill="#38bdf8" opacity="0.18" stroke="#7dd3fc" stroke-width="2"/>
    <text x="132" y="242" fill="#d6eefe" text-anchor="middle">检查</text>
    <rect x="204" y="220" width="120" height="34" rx="17" fill="#e2e8f0" opacity="0.14" stroke="#e2e8f0" stroke-width="2"/>
    <text x="264" y="242" fill="#f1f5f9" text-anchor="middle">监控</text>
  </g>
</svg>
