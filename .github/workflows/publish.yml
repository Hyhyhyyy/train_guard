name: Publish release candidate

on:
  push:
    tags:
      - "v*.*.*rc*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONPATH: src
  PYTHONUTF8: "1"

jobs:
  publish:
    name: Gate, build, publish, and create prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: pypi
      url: https://pypi.org/p/train-guard
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install complete release toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,all]" cyclonedx-bom
      - name: Require tag, package, and documented versions to agree
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import train_guard
          expected = "v" + train_guard.__version__
          assert os.environ["RELEASE_TAG"] == expected, (os.environ["RELEASE_TAG"], expected)
          assert "rc" in train_guard.__version__, "publish.yml only creates prereleases"
          for name in ("README.md", "README_zh-CN.md", "CHANGELOG.md", "docs/RELEASE.md"):
              assert train_guard.__version__ in Path(name).read_text(encoding="utf-8"), name
          PY
      - name: Run full quality and test gates
        run: |
          ruff check .
          ruff format --check .
          mypy src/train_guard scripts
          python -m pytest
      - name: Validate generated and privacy boundaries
        run: |
          python scripts/bundle_singlefile.py
          git diff --exit-code -- release/train_guard.py
          python scripts/check_release_manifest.py
          python scripts/privacy_scan.py --mode source --root . --allowlist configs/privacy_scan_allowlist.json
          python scripts/privacy_scan.py --mode release --allowlist configs/privacy_scan_allowlist.json
          python release/train_guard.py --version
      - name: Build and inspect wheel and sdist
        run: |
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
          python tests/test_release_engineering.py
      - name: Smoke-test wheel in isolation
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          wheel-smoke/bin/train-guard --version
          wheel-smoke/bin/train-guard --help
      - name: Audit isolated wheel environment
        run: |
          SITE=$(wheel-smoke/bin/python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          python -m pip_audit --path "$SITE"
      - name: Assemble checksums and SBOM
        run: |
          mkdir release-assets
          cp dist/*.whl dist/*.tar.gz release-assets/
          cp release/train_guard.py release-assets/train_guard.py
          cyclonedx-py environment wheel-smoke/bin/python --output-format JSON \
            --output-file release-assets/train-guard-${GITHUB_REF_NAME#v}.sbom.json
          cd release-assets
          sha256sum *.whl *.tar.gz train_guard.py *.sbom.json > SHA256SUMS
      - name: Publish distributions with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@6733eb7d741f0b11ec6a39b58540dab7590f9b7d # v1.14.0
      - name: Create GitHub prerelease with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release-assets/*
          --prerelease --generate-notes --verify-tag
