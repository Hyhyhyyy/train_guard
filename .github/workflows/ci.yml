name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONPATH: src
  PYTHONUTF8: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package, all extras, and test tools
        run: python -m pip install -e ".[dev,all]"
      - name: Run complete pytest suite
        run: python -m pytest

  quality:
    name: Lint, type check, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy src/train_guard scripts
      - name: Coverage
        run: pytest --cov=train_guard --cov-report=term-missing

  package:
    name: Build and audit distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install current packaging and audit tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pip-audit
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Audit installed dependencies
        run: python -m pip_audit
      - name: Install and smoke-test wheel
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install dist/*.whl
          wheel-smoke/bin/train-guard --version
          wheel-smoke/bin/train-guard --help
      - name: Verify sdist content boundary
        run: python tests/test_release_engineering.py

  release-gates:
    name: Single-file release gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Regenerate single-file candidate
        run: python scripts/bundle_singlefile.py
      - name: Reject generated-file drift
        run: git diff --exit-code -- release/train_guard.py
      - name: Validate release manifest
        run: python scripts/check_release_manifest.py
      - name: Scan tracked source boundary
        run: >-
          python scripts/privacy_scan.py --mode source --root .
          --allowlist configs/privacy_scan_allowlist.json
      - name: Scan release candidate
        run: >-
          python scripts/privacy_scan.py --mode release
          --allowlist configs/privacy_scan_allowlist.json
      - name: Smoke-test package and single file
        run: |
          python -m pip install -e .
          train-guard --version
          python release/train_guard.py --version
      - name: Run release contract tests
        run: |
          python tests/test_release_manifest.py
          python tests/test_privacy_scan.py
