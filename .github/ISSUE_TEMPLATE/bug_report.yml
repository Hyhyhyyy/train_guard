name: Bug report
description: Report a reproducible defect using synthetic data
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, private paths, real datasets, reports, or training logs.
        Security vulnerabilities must be reported through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Train Guard version
      placeholder: "0.6.0rc1"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Python version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      description: Include sanitized commands, configuration, and inputs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, private paths, real records, and training artifacts.
          required: true
        - label: This is not a security vulnerability.
          required: true
